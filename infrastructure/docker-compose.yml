services:

  # ── Redis (authorization-dedicated) ─────────────────────────
  redis-authz:
    build:
      context: ./redis
    container_name: core-platform-redis-authz
    ports:
      - "6380:6379"
    volumes:
      - redis_authz_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis_authz_data:
