# Authorization-dedicated Redis instance
# PDR requirement: noeviction policy so authorization data is never silently dropped

maxmemory 256mb
maxmemory-policy noeviction

# Networking
bind 0.0.0.0
protected-mode no
port 6379

# Persistence (RDB snapshots for restart recovery)
save 900 1
save 300 10
save 60 10000

# Logging
loglevel notice
