spring:
  application:
    name: bff-gateway
  profiles:
    default: dev
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: bff-gateway
            client-secret: ${KC_CLIENT_SECRET}
            scope: openid,profile,email
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          keycloak:
            issuer-uri: http://localhost:9000/realms/core-platform

  cloud:
    gateway:
      routes:
        - id: users-service
          uri: http://localhost:9020
          predicates:
            - Path=/api/users/**
          filters:
            - TokenRelay=
        - id: roles-service
          uri: http://localhost:9020
          predicates:
            - Path=/api/roles/**
          filters:
            - TokenRelay=
        - id: permissions-service
          uri: http://localhost:9020
          predicates:
            - Path=/api/permissions/**
          filters:
            - TokenRelay=
        - id: service-accounts
          uri: http://localhost:9020
          predicates:
            - Path=/api/service-accounts/**
          filters:
            - TokenRelay=
        - id: orders-service
          uri: http://localhost:9030
          predicates:
            - Path=/api/orders/**
          filters:
            - TokenRelay=
        - id: policy-sets
          uri: http://localhost:9020
          predicates:
            - Path=/api/policy-sets/**
          filters:
            - TokenRelay=
        - id: authorization
          uri: http://localhost:9020
          predicates:
            - Path=/api/authorization/**
          filters:
            - TokenRelay=
        - id: users-service-actuator
          uri: http://localhost:9020
          predicates:
            - Path=/api/internal/**
          filters:
            - TokenRelay=

server:
  port: 9010

